<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F6F3">
<title>Padi Tamil — You already speak it.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
/* apply the saved theme before the first paint, so there is no flash */
try{ var _s=(JSON.parse(localStorage.getItem('tamilpath.v1')||'{}').settings||{});
     document.documentElement.setAttribute('data-theme', _s.theme || 'mayil');
     if (_s.scheme === 'light' || _s.scheme === 'dark')
       document.documentElement.setAttribute('data-scheme', _s.scheme); }catch(e){}
</script>
<link rel="stylesheet" href="app/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23E8A33D'/><text x='32' y='47' font-size='30' text-anchor='middle' fill='%23fff' font-family='sans-serif'>%E0%AE%AA%E0%AE%9F%E0%AE%BF</text></svg>">
</head>
<body>

<header id="topbar">
  <button id="backBtn" class="icon-btn" aria-label="Go back" hidden>‹</button>
  <div id="topTitle">Padi Tamil</div>
  <button id="soundBtn" class="icon-btn" aria-label="Toggle sound">🔊</button>
</header>

<main id="app" tabindex="-1"></main>

<nav id="tabbar">
  <a href="#/" data-tab="/"><span>🛤️</span>Path</a>
  <a href="#/review" data-tab="review"><span>🔁</span>Review<em id="dueDot" hidden></em></a>
  <a href="#/grid" data-tab="grid"><span>▦</span>Chart</a>
  <a href="#/stories" data-tab="stories"><span>📖</span>Stories</a>

</nav>

<script src="app/data.js"></script>
<script src="app/stories.js"></script>
<script src="app/register.js"></script>
<script src="app/strokes.js"></script>
<script src="app/compose.js"></script>
<script src="app/engine.js"></script>
<script src="app/ui.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function(){});
  // when a new worker takes over an already-running page, the page is
  // still showing the old code - reload it once so it never lingers
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
}
</script>
</body>
</html>
